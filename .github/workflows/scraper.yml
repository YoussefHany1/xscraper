name: Scrape X

# Every 15 minutes. Keep this in step with cacheTtlSeconds in config.js (600),
# otherwise the edge serves replies older than the data behind them.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      accounts:
        description: "Override accounts (comma separated), e.g. nasa,github"
        required: false
        default: ""

# Writes the data/ directory back to the repo. Least privilege: contents only.
permissions:
  contents: write

# Never let a manual run and a scheduled run race on the same data files.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    # Switch hosts without editing this file: set a RUNS_ON repository variable to
    # [self-hosted, windows] to run the job on your own machine, where the IP is
    # residential and x.com is reachable. See README.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the token can push the data/ commit back.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight diagnostics
        # Makes one plain HTTPS request to x.com with no browser, which
        # separates "the IP is blocked" from "the fingerprint is blocked".
        # Never fails the job -- it exists to tell you which one it is.
        continue-on-error: true
        env:
          X_STORAGE_STATE: ${{ secrets.X_STORAGE_STATE }}
        run: node scripts/doctor.js

      - name: Install fallback Chromium
        # Edge and Chrome are already on the runner image and are what
        # lib/browser.js prefers -- Cloudflare fingerprints Playwright's bundled
        # headless shell much harder. This is only insurance for the fallback
        # path, so failure here must not fail the job.
        run: npx playwright-core install --with-deps chromium || true

      - name: Scrape
        env:
          # CI has no interactive login, so the session must come from the
          # secret rather than the .browser-profile/ directory.
          XSCRAPER_SESSION: env
          XSCRAPER_BROWSER: playwright
          # Drives the runner's installed Edge. Falls back to chrome, then to
          # the bundled build. Override to pin a specific binary.
          XSCRAPER_BROWSER_CHANNEL: ${{ vars.XSCRAPER_BROWSER_CHANNEL || 'msedge' }}
          X_STORAGE_STATE: ${{ secrets.X_STORAGE_STATE }}
          # A residential proxy is the other way to fix a blocked runner IP.
          # Format: http://user:pass@host:port
          XSCRAPER_PROXY: ${{ secrets.XSCRAPER_PROXY }}
        run: |
          if [ -n "${{ inputs.accounts }}" ]; then
            node index.js --accounts "${{ inputs.accounts }}"
          else
            node index.js
          fi

      - name: Upload debug screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/debug-*.png
          if-no-files-found: ignore

      - name: Commit dataset
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new tweets; nothing to commit."
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A scheduled run can collide with a push from a laptop, so rebase
          # instead of assuming a fast-forward.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"